[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-swarm"
version = "2.1.0"
description = "Cost-aware, fault-tolerant multi-agent swarm for large batch workloads on Claude"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.105"]
keywords = ["llm", "multi-agent", "agents", "claude", "batching", "thompson-sampling", "reliability"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: AsyncIO",
]

[project.urls]
Homepage = "https://github.com/Chetan0246/multi-agent-swarm"
Documentation = "https://github.com/Chetan0246/multi-agent-swarm/blob/main/docs/ARCHITECTURE.md"
Changelog = "https://github.com/Chetan0246/multi-agent-swarm/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "matplotlib>=3.8"]

[project.scripts]
swarm = "swarm.__main__:main"

[tool.setuptools]
packages = ["swarm"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E731", "SIM108", "SIM115", "B905"]  # SIM115: long-lived journal/event handles

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
