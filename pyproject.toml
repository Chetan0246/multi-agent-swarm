[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-swarm"
version = "3.0.0"
description = "Deep research with a multi-agent swarm on Claude: free web search, parallel cited workers, every quote checked against its source"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Multi-Agent Swarm contributors" }]
dependencies = ["anthropic>=2.12,<3", "httpx2>=2.0", "tomli>=2.0; python_version < '3.11'"]
keywords = ["llm", "multi-agent", "agents", "claude", "deep-research", "web-search", "citations",
            "fact-checking", "tinyfish", "research-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Chetan0246/multi-agent-swarm"
Documentation = "https://chetan0246.github.io/multi-agent-swarm/"
Changelog = "https://github.com/Chetan0246/multi-agent-swarm/blob/main/CHANGELOG.md"
Issues = "https://github.com/Chetan0246/multi-agent-swarm/issues"

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
pdf = ["pypdf>=4"]
all = ["multi-agent-swarm[server,pdf]"]
dev = ["multi-agent-swarm[server,pdf]", "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10",
       "matplotlib>=3.8", "httpx>=0.27"]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
swarm = "swarm.__main__:main"

[tool.setuptools]
packages = ["swarm", "swarm.search"]

[tool.setuptools.package-data]
swarm = ["web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["swarm"]
omit = ["swarm/__main__.py"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E731", "SIM108", "SIM115", "B905"]  # SIM115: long-lived journal/event handles

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
