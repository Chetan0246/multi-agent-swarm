name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check swarm tests scripts
      - run: mypy swarm
      - run: pytest -q --cov --cov-report=term-missing:skip-covered

  audit:
    # Known vulnerabilities in the runtime dependencies (all extras), from the PyPA advisory DB.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: pip install '.[all]'
      - run: pip-audit --desc on

  bench-smoke:
    # The simulator benchmark is the regression guard for the scheduler's trade-offs.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m swarm bench --n 200 --seeds 1 --profile v1-tuned --out bench.json
      - name: Deep research end to end (offline mock)
        run: python -m swarm research "Smoke test question" --mock --out report.html
      - name: Package builds and installs cleanly
        run: |
          pip install build && python -m build
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl && /tmp/v/bin/swarm doctor
      - name: Evaluation harness (offline mock)
        run: python -m swarm eval --mock --limit 4 --out eval.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: |
            bench.json
            report.html
            eval.json
